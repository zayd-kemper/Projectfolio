            - paragraph [ref=f2e217]: Dear Hiring Manager, I am writing to express my interest in the Mechanical Design Engineer position at Orbit Dynamics. As a Computer Engineering student at Arizona State University with a strong foundation in embedded systems and FPGA design, I am excited about the opportunity to contribute to innovative mechanical design projects that push technological boundaries. My academic and project experience has equipped me with a unique blend of hardware and software skills that are directly applicable to mechanical design engineering. Through projects like the BLDC Motor Driver and PID Test Bench, I have developed hands-on experience with motor control systems, PCB design using KiCad, and precision measurement techniques using oscilloscopes. My work on the Sun Devil Rover Telemetry Stack involved designing robust communication systems that operate reliably in challenging environments, demonstrating my ability to create solutions that meet stringent performance requirements. I have also developed expertise in control systems through projects such as the FPGA Traffic Controller, where I implemented finite-state-machine logic for safe and reliable operation. My experience with embedded Linux, FreeRTOS, and real-time systems provides me with a systems-level perspective that I believe is valuable for mechanical design engineering. Additionally, my work on the Edge Vision Occupancy Counter project involved integrating hardware and software components to create a complete solution, showcasing my ability to work across disciplines. I am particularly drawn to Orbit Dynamics because of your focus on innovative aerospace solutions. My background in embedded systems, combined with my mechanical engineering coursework, positions me to contribute effectively to your team's mechanical design challenges. I would welcome the opportunity to discuss how my skills and passion for engineering can support Orbit Dynamics' mission. Thank you for your consideration. Sincerely, Ari Patel
